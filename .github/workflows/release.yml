name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.8.14"

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          METADATA_VERSION=$(sed -n 's/^version=//p' metadata.txt)
          [ "$METADATA_VERSION" = "$RELEASE_TAG" ] || { echo "metadata version $METADATA_VERSION does not match tag $RELEASE_TAG" >&2; exit 1; }

      - name: Build extlibs archive
        run: make extlibs

      - name: Stage plugin repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          STAGE_DIR: ${{ runner.temp }}/ccd-plugin-stage
        run: |
          set -euo pipefail
          python scripts/stage_plugin.py "$STAGE_DIR"
          git -C "$STAGE_DIR" init
          git -C "$STAGE_DIR" config user.name "github-actions[bot]"
          git -C "$STAGE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$STAGE_DIR" add .
          git -C "$STAGE_DIR" commit -m "Stage $RELEASE_TAG"

      - name: Generate release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          PREVIOUS_TAG=$(git tag --merged "${RELEASE_TAG}^" --sort=-v:refname | grep -E -m1 '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            {
              echo "## Changes since $PREVIOUS_TAG"
              echo
              git log --date-order --format="- %s ([%h](https://github.com/${REPOSITORY}/commit/%H))" "${PREVIOUS_TAG}..${RELEASE_TAG}"
              echo
              echo "**Full changelog:** https://github.com/${REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
            } > "$NOTES_FILE"
          else
            { echo "## Changes"; echo; git log --date-order --format="- %s ([%h](https://github.com/${REPOSITORY}/commit/%H))" "$RELEASE_TAG"; } > "$NOTES_FILE"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$NOTES_FILE" --verify-tag --draft

      - name: Package and publish plugin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QGIS_TOKEN: ${{ secrets.QGIS_TOKEN }}
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          STAGE_DIR: ${{ runner.temp }}/ccd-plugin-stage
        run: |
          set -euo pipefail
          ARGS=(--github-token "$GITHUB_TOKEN")
          if [ -n "$QGIS_TOKEN" ]; then
            ARGS+=(--qgis-token "$QGIS_TOKEN")
          elif [ -n "$OSGEO_USERNAME" ] && [ -n "$OSGEO_PASSWORD" ]; then
            ARGS+=(--osgeo-username "$OSGEO_USERNAME" --osgeo-password "$OSGEO_PASSWORD")
          elif [ -n "$OSGEO_USERNAME" ] || [ -n "$OSGEO_PASSWORD" ]; then
            echo "OSGEO_USERNAME and OSGEO_PASSWORD must be configured together" >&2
            exit 1
          fi
          cd "$STAGE_DIR"
          uvx --from qgis-plugin-ci==2.10.0 qgis-plugin-ci release "$RELEASE_TAG" "${ARGS[@]}"
          test -f "CCD_Plugin.$RELEASE_TAG.zip"
          unzip -l "CCD_Plugin.$RELEASE_TAG.zip" | grep -q 'CCD_Plugin/resources.py'
          if unzip -l "CCD_Plugin.$RELEASE_TAG.zip" | grep -Eq 'resources_rc|resources\.qrc|/tests/|__pycache__|\.pyc$'; then
            echo "Plugin archive contains excluded files" >&2
            exit 1
          fi

      - name: Upload extlibs release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" extlibs.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
