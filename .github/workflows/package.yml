name: Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Numeric release tag to package
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          version: "0.8.14"
          enable-cache: true

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          METADATA_VERSION=$(sed -n 's/^version=//p' metadata.txt)
          [ "$METADATA_VERSION" = "$RELEASE_TAG" ] || { echo "metadata version $METADATA_VERSION does not match tag $RELEASE_TAG" >&2; exit 1; }

      - name: Build extlibs archive
        run: make extlibs

      - name: Stage plugin repository
        env:
          STAGE_DIR: ${{ runner.temp }}/ccd-plugin-stage
        run: |
          set -euo pipefail
          python scripts/stage_plugin.py "$STAGE_DIR"
          git -C "$STAGE_DIR" init
          git -C "$STAGE_DIR" config user.name "github-actions[bot]"
          git -C "$STAGE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$STAGE_DIR" add .
          git -C "$STAGE_DIR" commit -m "Stage ${{ inputs.tag }}"

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          STAGE_DIR: ${{ runner.temp }}/ccd-plugin-stage
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          uvx --from qgis-plugin-ci==2.10.0 qgis-plugin-ci package "$RELEASE_TAG"
          test -f "CCD_Plugin.$RELEASE_TAG.zip"
          unzip -l "CCD_Plugin.$RELEASE_TAG.zip" | grep -q 'CCD_Plugin/resources.py'
          if unzip -l "CCD_Plugin.$RELEASE_TAG.zip" | grep -Eq 'resources_rc|resources\.qrc|/tests/|__pycache__|\.pyc$'; then
            echo "Plugin archive contains excluded files" >&2
            exit 1
          fi
          cp "CCD_Plugin.$RELEASE_TAG.zip" "$GITHUB_WORKSPACE/"

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CCD-Plugin-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            CCD_Plugin.${{ inputs.tag }}.zip
            extlibs.zip
