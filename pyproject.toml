[project]
name = "CCD-Plugin"
version = "25.8"
description = "Qgis plugin for Continuous Change Detection (CCDC) algorithm of a time series at a given coordinate"
authors = [
    { name = "Xavier Corredor Llano, SMByC", email = "xavier.corredor.llano@gmail.com" },
]
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "plotly",
]

[project.urls]
Homepage = "https://github.com/SMByC/CCD-Plugin"
Repository = "https://github.com/SMByC/CCD-Plugin"
Issues = "https://github.com/SMByC/CCD-Plugin/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "numpy",
    "earthengine-api",
]

[dependency-groups]
dev = [
    "ruff",
    "numpy",
    "earthengine-api",
]

# No pytest config on purpose: pytest resolves test modules through the enclosing package, and
# CCD_Plugin/__init__.py imports qgis, which is not importable outside QGIS. Run the suite with
# unittest, which imports the test modules directly:
#
#   PYTHONPATH="$PWD:$PWD/extlibs" python -m unittest tests.test_plot tests.test_gee_data_landsat
#
# The live Earth Engine tests are opt-in and need authenticated credentials:
#
#   PYTHONPATH="$PWD:$PWD/extlibs" CCD_RUN_LIVE_GEE=1 python -m unittest tests.test_gee_live

[tool.pyright]
extraPaths = [".."]  # include project folder
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 120
# resources.py is generated by pyrcc; do not lint or reformat it
extend-exclude = ["extlibs", "resources.py"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF", "SIM"]
extend-select = ["E226"]
ignore = ["B904", "SIM102", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
